name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  crystal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - uses: oprypin/install-crystal@v1
        with:
          crystal: 1.19.1
      - run: shards install
      - run: crystal tool format --check src spec examples
      - run: crystal spec
      - run: crystal build examples/minimal_bot.cr -o "$RUNNER_TEMP/minimal_bot"
      - name: Type-check single-version consumers
        run: |
          for version in 26.1 26.3; do
            consumer="$RUNNER_TEMP/consumer_${version/./_}.cr"
            printf 'require "rosegold/%s"\nrequire "rosegold-viewer"\nRosegoldViewer.mount(Rosegold::Bot.new(Rosegold::Client.new("localhost"))).enable\n' "$version" > "$consumer"
            CRYSTAL_PATH="$(crystal env CRYSTAL_PATH):src" crystal build --no-codegen "$consumer"
          done

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpng-dev pkg-config
      - uses: oprypin/install-crystal@v1
        with:
          crystal: 1.19.1
      - run: crystal spec tools/spec
      - run: crystal build tools/build-pack.cr -o "$RUNNER_TEMP/build-pack"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check:dist
      - run: npm test
