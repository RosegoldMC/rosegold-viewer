<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rosegold Terrain Fixture</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #151b27; color: #edf0f7; }
    main { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.5rem 2rem; padding: 1rem 1.25rem; }
    h1 { font-size: 1.125rem; margin: 0; }
    p { color: #bbc6da; font-size: 0.875rem; margin: 0.25rem 0 0; }
    output { color: #d4dfeb; font-size: 0.875rem; }
    output[data-state="unavailable"], output[data-state="lost"] { color: #ffcc97; }
    .viewport { min-height: 300px; position: relative; border-top: 1px solid #353e50; }
    canvas { width: 100%; height: 100%; position: absolute; display: block; background: #1b2435; }
  </style>
  <script defer src="fixture-bundle.js"></script>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Terrain fixture</h1>
        <p>Synthetic terrain · Fullbright · Solid voxel approximation</p>
      </div>
      <output aria-live="polite">Loading fixture…</output>
    </header>
    <div class="viewport"><canvas aria-label="Synthetic canyon with a block arch and marker tower"></canvas></div>
  </main>
</body>
</html>
