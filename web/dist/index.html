<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Rosegold Terrain Viewer</title>
  <link rel="stylesheet" href="viewer.css">
  <script defer src="viewer-bundle.js"></script>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Rosegold Terrain Viewer</h1>
        <p>Read-only · Fullbright · Solid voxel approximation</p>
      </div>
      <div class="connection">
        <form method="post" action="/session" autocomplete="off" novalidate>
          <label for="secret">Pairing secret</label>
          <div class="controls">
            <input id="secret" type="password" autocapitalize="off" autocomplete="off" spellcheck="false">
            <button id="connect" type="submit" disabled>Pair</button>
          </div>
        </form>
        <button id="disconnect" type="button" hidden>Detach</button>
        <output id="feed-status" aria-live="polite">Disconnected</output>
        <output id="renderer-status" aria-live="polite" hidden></output>
      </div>
    </header>
    <div class="viewport">
      <canvas aria-label="Terrain from the bot's viewpoint"></canvas>
      <div id="hud" aria-label="Player status" hidden>
        <div id="mining" hidden>
          <label for="mining-progress">Breaking</label>
          <progress id="mining-progress" max="100" value="0"></progress>
          <output for="mining-progress">0%</output>
        </div>
        <dl id="hud-stats">
          <div><dt>Health</dt><dd id="hud-health">0</dd></div>
          <div><dt>Food</dt><dd id="hud-food">0</dd><dd class="max">/ 20</dd></div>
        </dl>
        <p id="hud-held">Empty hand</p>
        <ol id="hud-slots" aria-label="Hotbar">
          <li><span class="key">1</span><span class="item"></span><span class="count"></span></li>
          <li><span class="key">2</span><span class="item"></span><span class="count"></span></li>
          <li><span class="key">3</span><span class="item"></span><span class="count"></span></li>
          <li><span class="key">4</span><span class="item"></span><span class="count"></span></li>
          <li><span class="key">5</span><span class="item"></span><span class="count"></span></li>
          <li><span class="key">6</span><span class="item"></span><span class="count"></span></li>
          <li><span class="key">7</span><span class="item"></span><span class="count"></span></li>
          <li><span class="key">8</span><span class="item"></span><span class="count"></span></li>
          <li><span class="key">9</span><span class="item"></span><span class="count"></span></li>
        </ol>
      </div>
    </div>
  </main>
</body>
</html>
