<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Rosegold Terrain Viewer</title>
  <link rel="stylesheet" href="viewer.css">
  <script defer src="viewer-bundle.js"></script>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Rosegold Terrain Viewer</h1>
        <p>Read-only · Fullbright · Solid voxel approximation</p>
      </div>
      <div class="connection">
        <form method="post" action="/session" autocomplete="off" novalidate>
          <label for="secret">Pairing secret</label>
          <div class="controls">
            <input id="secret" type="password" autocapitalize="off" autocomplete="off" spellcheck="false">
            <button id="connect" type="submit" disabled>Pair</button>
          </div>
        </form>
        <button id="disconnect" type="button" hidden>Detach</button>
        <output id="feed-status" aria-live="polite">Disconnected</output>
        <output id="renderer-status" aria-live="polite" hidden></output>
      </div>
    </header>
    <div class="viewport"><canvas aria-label="Terrain from the bot's viewpoint"></canvas></div>
  </main>
</body>
</html>
